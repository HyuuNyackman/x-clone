name: Claude Code Review

on:
  pull_request:
    # synchronize を含める: 結果をマージの必須チェックにするため、最新のコミットごとにレビューが要る (ADR-0016)。
    # push のたびに利用枠を使うので、同じ PR の古い実行は、新しい push で中止する。
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # 公開リポジトリのため、オーナー本人と、Claude (CI で PR を作る・修正を push する) の操作だけをレビューする。
    # fork からの PR は Secrets が渡らず、第三者に利用枠を使わせないためにも除外する。
    # 注意: このジョブがスキップされると、必須チェックは成功として扱われる。Claude の操作を除外すると、
    # Claude が作った PR がレビューなしで通ってしまうので、actor に claude[bot] を含めている。
    if: |
      (github.actor == github.repository_owner || github.actor == 'claude[bot]') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # レビューコメントの投稿に必要
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # .claude/skills/ は .gitignore 対象のため、コミット済みの自作スキル (.apm/skills/) を復元する
      - name: Restore project skills
        run: |
          mkdir -p .claude/skills
          cp -r .apm/skills/. .claude/skills/

      # レビューの結果を、この実行の開始以降のコメントから判定するために、開始時刻を控える。
      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allow_fork_prs: 'false'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # モデルと最大ターン数はリポジトリ変数 (Settings > Secrets and variables > Actions > Variables) で変更できる。
          #   CLAUDE_MODEL     : 使用するモデル ID。未設定なら claude-sonnet-5-5
          #   CLAUDE_MAX_TURNS : 1回の実行で許可する最大ターン数。未設定なら 30
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          claude_args: |
            --model ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
            --max-turns ${{ vars.CLAUDE_MAX_TURNS || '30' }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment"

      # レビューに指摘があれば、このジョブを失敗させる (マージの必須チェックにするため)。
      # 判定は、レビューが投稿するコメントの「No issues found」で行う。コメントが見つからないときも失敗にする。
      - name: Judge review result
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            | node scripts/ci/judge-review.mjs "$STARTED_AT"
