name: E2E

# PR ごとに、ローカルの Supabase に対して、Web 版を Playwright で操作する。
# 本番の Supabase には繋がない。接続先は start-supabase が渡すローカルの値だけを使い、vars.* は参照しない。
# 接続先のガードは、ビルドと同じ job に置く (検査した値とテストが使う値がずれないようにするため)。

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/start-supabase
      - name: 接続先がローカルか確認する (ビルド前)
        run: node scripts/e2e/check-local-target.mjs env
      # EXPO_PUBLIC_* は、start-supabase が書いたローカルの値が使われる。
      - run: pnpm build:web
      - name: ビルド成果物にホスティング版の Supabase が無いか確認する
        run: node scripts/e2e/check-local-target.mjs dist
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: 結果を保存する
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
