name: Cloudflare Deploy

# Cloudflare への公開と撤去をまとめる。どのジョブが動くかは、呼び出し元のイベントで決まる。
#   preview  : develop 向けの PR の作成・更新 → Preview を公開してコメントする
#   cleanup  : develop 向けの PR を閉じた    → Preview を削除する
#   deploy   : develop への push、手動実行   → 本番にデプロイする
# fork からの PR は Secrets が渡らないため、preview と cleanup から除外する。

on:
  workflow_call:

permissions:
  contents: read

jobs:
  preview:
    if: |
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.base_ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # Preview URL のコメント投稿に必要
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build:web
      - name: Deploy preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm exec wrangler preview --name "pr-${{ github.event.pull_request.number }}" --json | tee preview.json
          # --json でも、JSON の前にアセットのアップロード進捗が標準出力に混ざる。
          # 行頭が { の行から、行頭が } の行までだけを JSON として読む。取れなければ、空の URL をコメントせずに失敗させる。
          url=$(sed -n '/^{$/,/^}$/p' preview.json | jq -er '.preview.urls[0]')
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --edit-last --create-if-none \
            --body "Preview: ${{ steps.preview.outputs.url }}"

  cleanup:
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.base_ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Delete preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler preview delete --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation

  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build:web
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
