name: Cloudflare Deploy

# Cloudflare への公開と撤去をまとめる。どのジョブが動くかは、呼び出し元のイベントで決まる。
#   preview  : develop または main 向けの PR の作成・更新 → Preview を公開してコメントする
#   cleanup  : develop または main 向けの PR を閉じた    → Preview を削除する
#   deploy   : main への push、main での手動実行         → 本番にデプロイする (ADR-0015)
# develop への push では、本番に出さない。develop は統合の場で、本番に出すのは develop → main の PR をマージしたときだけ。
# fork からの PR は Secrets が渡らないため、preview と cleanup から除外する。

on:
  workflow_call:

permissions:
  contents: read

jobs:
  preview:
    if: |
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      (github.base_ref == 'develop' || github.base_ref == 'main') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # Preview URL のコメント投稿に必要
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build:web
        # EXPO_PUBLIC_* はビルド時にバンドルへ埋め込まれる。Cloudflare 側ではなく、ここで渡す。
        # 公開前提の値 (URL と publishable キー) なので Secrets ではなく Variables を使う。
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      # check の実行中に PR をマージすると、閉じたときの cleanup が先に終わり、その後でこのジョブが Preview を作って残してしまう。
      # ビルドの後、公開の直前に PR の状態を確かめ、閉じていたら公開しない。
      - name: Check the PR is still open
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json state --jq .state)
          echo "PR の状態: $state"
          echo "open=$([ "$state" = OPEN ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Deploy preview
        if: steps.state.outputs.open == 'true'
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm exec wrangler preview --name "pr-${{ github.event.pull_request.number }}" --json | tee preview.json
          # --json でも、JSON の前にアセットのアップロード進捗が標準出力に混ざる。
          # 行頭が { の行から、行頭が } の行までだけを JSON として読む。取れなければ、空の URL をコメントせずに失敗させる。
          url=$(sed -n '/^{$/,/^}$/p' preview.json | jq -er '.preview.urls[0]')
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL
        if: steps.state.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --edit-last --create-if-none \
            --body "Preview: ${{ steps.preview.outputs.url }}"

  cleanup:
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      (github.base_ref == 'develop' || github.base_ref == 'main') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Delete preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Preview がまだないとき (公開の前に PR を閉じたとき) は、削除するものがないので成功にする。
        run: |
          if ! out=$(pnpm exec wrangler preview delete --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation 2>&1); then
            echo "$out"
            echo "$out" | grep -q 'code: 10025' || exit 1
            echo "Preview がないので、何もしない"
          else
            echo "$out"
          fi

  deploy:
    # 手動実行も、main でだけ本番に出す (別のブランチから実行しても動かない)。
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build:web
        # EXPO_PUBLIC_* はビルド時にバンドルへ埋め込まれる。Cloudflare 側ではなく、ここで渡す。
        # 公開前提の値 (URL と publishable キー) なので Secrets ではなく Variables を使う。
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
