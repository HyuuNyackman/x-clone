name: Supabase Migrate

# supabase/migrations のマイグレーションをリモートの Supabase に反映する。どのジョブが動くかは、呼び出し元のイベントで決まる。
#   dry-run : develop 向けの PR の作成・更新 → 適用される予定のマイグレーションを表示するだけで、DB は変えない
#   push    : develop への push、手動実行     → リモートに適用する
# どちらも supabase/migrations に変更があるときだけ動く (手動実行は常に動く)。
# 認証情報は GitHub Secrets だけに置く (SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD / SUPABASE_PROJECT_REF)。
# fork からの PR は Secrets が渡らないため、dry-run から除外する。

on:
  workflow_call:

permissions:
  contents: read

env:
  # ローカルの CLI と揃える。上げるときは両方を同時に変える。
  SUPABASE_CLI_VERSION: 3.3.0

jobs:
  # マイグレーションに変更があるかを調べる。ないときは、Supabase に接続するジョブを動かさない。
  changes:
    # PR を閉じたときは何もしない
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      migrations: ${{ steps.diff.outputs.migrations }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base=""
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
          esac
          # 手動実行や、比較元がない (新しいブランチ、履歴の書き換え) ときは、変更ありとして扱う
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD -- supabase/migrations | grep -q .; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

  dry-run:
    needs: changes
    if: |
      needs.changes.outputs.migrations == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.base_ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - run: supabase db push --remote --dry-run

  push:
    needs: changes
    if: |
      needs.changes.outputs.migrations == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # マイグレーションが同時に走らないよう、1つずつ順番に流す。
    concurrency:
      group: supabase-migrate
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - run: supabase db push --remote --yes
