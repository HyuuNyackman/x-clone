    - expo/skills/plugins/expo/skills/expo-native-ui
    - expo/skills/plugins/expo/skills/expo-data-fetching
    - expo/skills/plugins/expo/skills/expo-design-system
    - expo/skills/plugins/expo/skills/expo-project-structure
    - vercel-labs/agent-skills/skills/react-native-skills
    - cloudflare/skills/skills/wrangler
    - cloudflare/skills/skills/frameworks-on-cloudflare
